plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    alias(libs.plugins.android.application) apply false
}

group = 'com.corrodinggames.rts'
version = '1.0-SNAPSHOT'
sourceCompatibility = '17'
targetCompatibility = '17'

// T1.2: PC 端主入口
mainClassName = 'com.corrodinggames.rts.java.Main'

repositories {
    mavenCentral()
}

dependencies {
    // 本地 JAR 依赖（排除 Linux natives 和 natives 子目录中的非 JAR 文件）
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['natives-linux.jar'])
}

// 定义本地 natives 目录
def nativesDir = file('libs/natives/windows')

test {
    useJUnitPlatform()
}

compileJava {
    options.encoding = 'UTF-8'
}

// 配置 run 任务使用本地 DLL
tasks.named('run', JavaExec) {
    jvmArgs "-Djava.library.path=${nativesDir.absolutePath}"
}

// shadowJar 仅合并服务文件，不打包 DLL
shadowJar {
    mergeServiceFiles()
}

// 编译时复制 DLL 到 build 目录
task copyNatives(type: Copy) {
    from nativesDir
    into "$buildDir/natives"
}
tasks.named('processResources').configure {
    dependsOn copyNatives
}
