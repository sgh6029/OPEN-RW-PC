plugins {
    id 'com.android.application'//Android Support - compatible with older SDK versions
}

android {
    namespace 'com.corrodinggames.rts' // 在这里设置命名空间
    compileSdkVersion 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.corrodinggames.rts"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode 176
        versionName "1.15"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
            java {
                // 排除包含 PC 专用包的目录
                exclude 'com/corrodinggames/librocket/**'
                exclude 'com/corrodinggames/librocket/a.java'
                exclude 'com/corrodinggames/librocket/a$1.java'
                exclude 'com/corrodinggames/librocket/a$2.java'
                exclude 'com/corrodinggames/librocket/a$2$1.java'
                exclude 'com/corrodinggames/librocket/a$2$2.java'
                exclude 'com/corrodinggames/librocket/b.java'
                exclude 'com/corrodinggames/librocket/c.java'
                exclude 'com/corrodinggames/librocket/d.java'
                exclude 'com/corrodinggames/librocket/e.java'
                exclude 'com/corrodinggames/rts/java/**'
                exclude 'com/corrodinggames/rts/a/**'
                exclude 'com/corrodinggames/rts/tmp/**'
                exclude 'com/codedisaster/**'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 处理 Apache HTTP 库的遗留支持
    useLibrary 'org.apache.http.legacy'
    packagingOptions {
        exclude 'com/codedisaster/steamworks/**'
    }
}

dependencies {
    // 基础依赖
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core:1.3.2'
    
    // Fragment 支持（因为使用了 hasFragileUserData）
    implementation 'androidx.fragment:fragment:1.3.0'
    
    // 网络相关
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    
    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:core:1.5.0'
    compileOnly fileTree(dir: '../libs', include: ['*.jar'])
//    implementation files('build/intermediates/compile_and_runtime_not_namespaced_r_class_jar/release/R.jar')

}

configurations {
    implementation {
        exclude group: 'com.codedisaster.steamworks', module: 'steamworks'
    }
}